# Builds the site and runs the unit and browser tests on every push and pull request.
# Vercel deploys separately; a red ✗ here means something on the live site is likely broken.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Pinned: since ubuntu-latest moved to a newer Ubuntu, installing the test browsers there has hung
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Install test browsers
        timeout-minutes: 5 # fail fast if it hangs, instead of using up the whole job
        run: npx playwright install --with-deps chromium webkit

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
