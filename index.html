<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The site has its own light and dark themes, so browsers' automatic dark mode leaves it alone -->
    <meta name="color-scheme" content="light dark" />
    <title>Caleb Kautai: The web experience</title>
    <meta name="description" content="Come on in, there's cool stuff here. I Promise." />
    <meta property="og:title" content="Caleb Kautai: The web experience" />
    <meta property="og:description" content="Come on in, there's cool stuff here. I Promise." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.calebkautai.com" />
    <meta property="og:image" content="https://www.calebkautai.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.calebkautai.com/og.png" />
    <!-- The tattoo page's hack and the love interest popup are closed by a tap, which needs JavaScript -->
    <noscript><style>.hack, .taken { display: none; }</style></noscript>
    <!-- The tattoo page's hack is prerendered, so it's hidden before paint unless this visit is a scan -->
    <style>:root:not([data-scan]) .tattoo-hack { display: none; }</style>
    <script>
      // Apply a saved light/dark choice before first paint, so there's no flash of the other theme.
      try {
        const theme = localStorage.getItem('theme')
        if (theme) document.documentElement.dataset.theme = theme
        // Cheat codes switched on earlier this session (components/Cheats.jsx)
        for (const id of JSON.parse(sessionStorage.getItem('cheats') || '[]')) {
          document.documentElement.setAttribute('data-cheat-' + id, '')
        }
        // Arrived by scanning the tattoo's QR code (it points at /tattoo): a fresh load of that
        // page, not a reload or back/forward, and not from a link on this site (either domain).
        // Only then does the tattoo page play its hack and count a scan (pages/Tattoo.jsx).
        const nav = performance.getEntriesByType('navigation')[0]
        const fromSite = /caleb-?kautai/i.test(document.referrer)
        if (location.pathname.replace(/(.)\/$/, '$1') === '/tattoo' && (!nav || nav.type === 'navigate') && !fromSite) {
          document.documentElement.setAttribute('data-scan', '')
        }
      } catch {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
